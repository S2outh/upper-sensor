[package]
name = "south-upper-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.4.0", features = [ "defmt", "time", "time-driver-any", "stm32h723vg", "memory-x", "unstable-pac", "exti"]  }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-40_000_000"] }
embassy-futures = { version = "0.1.2" }

defmt = "1.0"
defmt-rtt = "1.0"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = { version = "0.6.1" }
embedded-can = "0.4.1"
static_cell = { version = "2.1.1", features = ["nightly"] }

south-common = { version = "0.2.0", features = ["h7"], git = "ssh://git@github.com/S2outh/south-common.git" }
lsm6dsv32 = { version = "0.1.0", git = "ssh://git@github.com/S2outh/LSM6dsv32.git" }

[profile.release]
debug = 2
